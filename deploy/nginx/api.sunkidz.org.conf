# Nginx reverse proxy for Sunkidz API
# Domain: api.sunkidz.org
# Backend: FastAPI/uvicorn on port 8000
#
# FIX for ERR_TOO_MANY_REDIRECTS: When behind Cloudflare (or similar proxy) with
# Flexible SSL, the proxy connects to origin over HTTP. Without the X-Forwarded-Proto
# check below, Nginx would redirect HTTP→HTTPS forever = loop.
#
# Install: sudo cp api.sunkidz.org.conf /etc/nginx/sites-available/
# Enable:  sudo ln -sf /etc/nginx/sites-available/api.sunkidz.org.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

upstream sunkidz_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

# HTTPS server (primary)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.sunkidz.org;

    # Allow up to 50 MB request bodies (file uploads, JSON, etc.)
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.sunkidz.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sunkidz.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

location = /api/v1/auth/login {
    limit_req zone=login_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://sunkidz_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# General API protection
location / {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://sunkidz_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Ensure CORS headers are present on all responses, including 5xx errors that
    # bypass FastAPI's CORSMiddleware and would otherwise reach the browser without them.
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
}
}

# HTTP server: redirect to HTTPS only when request is NOT from a proxy that already used HTTPS
# (Fixes redirect loop when using Cloudflare Flexible SSL)
server {
    listen 80;
    listen [::]:80;
    server_name api.sunkidz.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        # Only redirect when request is NOT from a proxy that already used HTTPS.
        # Fixes ERR_TOO_MANY_REDIRECTS with Cloudflare Flexible SSL.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://sunkidz_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
